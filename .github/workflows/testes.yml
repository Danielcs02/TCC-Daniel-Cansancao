name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Instalar dependências (versões fixadas no uv.lock)
        run: uv sync --locked --extra dev
      - name: Rodar testes
        run: uv run pytest -v
